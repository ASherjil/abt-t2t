# abt-t2t DUT (feed handler + quoter + order gateway) — single hardcoded config, no CLI args.
# [socket] is the kernel path (dut); [transport]/[network]/[market_data]/[order_entry] describe
# the ring datapath (dut_verbs / dut_dpdk, later ef_vi). Rig loopback: DUT on cx1 <-DAC-> sim on cx0.

[venue]
symbols        = ["AAPL", "MSFT", "AMD", "INTC", "QQQ", "SPY", "TQQQ", "GOOGL"]   # quoted (hot) symbols; the rest is booked
locates        = []         # optional stock-locate per symbol; empty = resolve from the ITCH stock directory
market_hours_only = true    # quote only between system events Q..M while trading state is 'T'
tick_wire      = 100        # wire units per tick (100 = $0.01 with 4-decimal wire prices)
cold_band_ticks = 2048      # price levels each side of the first seen price, unquoted symbols (+-$20.48)
hot_band_ticks  = 8192      # same for quoted symbols (+-$81.92); band_fraction widens expensive names
band_fraction   = 0.10      # band >= 10% of the anchor price on each side
cold_map_slots  = 1024      # initial order-ref map slots per unquoted symbol (grows by rehash)
hot_map_slots   = 65536     # per quoted symbol (real AAPL day peaks ~30k resting)
arena_mb        = 1024      # hugepage arena for all books (0 = heap); full feed uses ~500 MB of it
first_user_ref = 1
own_ref_min    = 4611686018427387904   # ITCH refs >= 2^62 are this DUT's own orders (sim's first_order_ref):
                                       # tracked but excluded from the book the strategy sees (0 = off)

[quoter]
half_spread_ticks   = 1       # ticks from fair value to each quote
quote_qty           = 100     # shares per side
skew_ticks_per_unit = 0.001   # quote shift per share of inventory (1000 shares = 1 tick)

[measure]
histogram_core = 7           # core the SPSC->HdrHistogram consumer thread pins to (-1 = unpinned)
queue_capacity = 65536       # SPSC ring depth per recorder
sig_figs       = 3           # HdrHistogram significant figures
log_file       = "results/dut.hlog"   # HdrHistogram interval log, appended across runs ("" = off)
flush_interval_s = 60        # one tagged line per recorder per interval (Tag=t2t_hw / t2t_sw / proc)

[socket]
oe_host      = "127.0.0.1"   # exchange sim order-entry TCP host
oe_port      = 5001
md_bind_host = "127.0.0.1"   # local address to bind for MoldUDP64 market data
md_port      = 5002
session      = "SIM0000001"
username     = "DUT001"

[transport]
interface = "cx1"            # NIC the DUT drives (ConnectX-4 Lx port 1 in loopback; X2522 later)
driver    = "mlx5_core"      # "mlx5_core" | "sfc" (dpdk backend devargs policy)
cpu_core  = 6                # isolated core the DUT hot loop pins to

[network]
local_mac = "b8:83:03:9c:d4:5d"   # cx1
local_ip  = "10.0.0.2"
peer_mac  = "b8:83:03:9c:d4:5c"   # cx0 (sim)
peer_ip   = "10.0.0.1"

# Market data: sim -> DUT. src = DUT-side port the feed is addressed to.
[market_data]
src_port = 41000
dst_port = 40000

# Order entry: DUT -> sim (orders), sim -> DUT (acks land on src_port).
[order_entry]
src_port = 41001
dst_port = 40001
